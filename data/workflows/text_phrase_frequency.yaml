# Analyse the most common 1–5 word phrases in a text file.
# For 1- and 2-word phrases, stop words are removed automatically by the skill.
#
# Submit:
#   POST /workflows/submit
#   {
#     "config": "text_phrase_frequency.yaml",
#     "vars": { "file": "data/webscrape/sites/coreweave.md" }
#   }
#
# CLI:
#   python3 scripts/workflow_run.py data/workflows/text_phrase_frequency.yaml \
#     --local --set file=data/webscrape/sites/coreweave.md

id: text_phrase_frequency
description: Count the most common 1–5 word phrases in {file}.

vars:
  file: data/webscrape/sites/coreweave.md
  top: "5"

steps:
  - id: read_file
    type: subprocess
    command:
      - cat
      - "{file}"

  - id: freq_1
    type: skill
    method: POST
    route: /skills/text_skill/phrasefrequency
    params:
      text: $step.read_file.stdout
      n: 1
      top: "{top}"
    depends_on: [read_file]

  - id: freq_2
    type: skill
    method: POST
    route: /skills/text_skill/phrasefrequency
    params:
      text: $step.read_file.stdout
      n: 2
      top: "{top}"
    depends_on: [read_file]

  - id: freq_3
    type: skill
    method: POST
    route: /skills/text_skill/phrasefrequency
    params:
      text: $step.read_file.stdout
      n: 3
      top: "{top}"
    depends_on: [read_file]

  - id: freq_4
    type: skill
    method: POST
    route: /skills/text_skill/phrasefrequency
    params:
      text: $step.read_file.stdout
      n: 4
      top: "{top}"
    depends_on: [read_file]

  - id: freq_5
    type: skill
    method: POST
    route: /skills/text_skill/phrasefrequency
    params:
      text: $step.read_file.stdout
      n: 5
      top: "{top}"
    depends_on: [read_file]

  - id: freq_6
    type: skill
    method: POST
    route: /skills/text_skill/phrasefrequency
    params:
      text: $step.read_file.stdout
      n: 6
      top: "{top}"
    depends_on: [read_file]

  - id: freq_7
    type: skill
    method: POST
    route: /skills/text_skill/phrasefrequency
    params:
      text: $step.read_file.stdout
      n: 7
      top: "{top}"
    depends_on: [read_file]

  - id: freq_8
    type: skill
    method: POST
    route: /skills/text_skill/phrasefrequency
    params:
      text: $step.read_file.stdout
      n: 8
      top: "{top}"
    depends_on: [read_file]

  - id: combine
    type: subprocess
    depends_on: [freq_1, freq_2, freq_3, freq_4, freq_5, freq_6, freq_7, freq_8]
    command:
      - python3
      - "-c"
      - |
        import json, sys
        results = {}
        for n in range(1, 9):
            raw = sys.argv[n]
            try:
                data = json.loads(raw)
            except Exception:
                data = raw
            results[f"{n}-word phrases"] = data
        print(json.dumps(results, indent=2))
      - $step.freq_1.items
      - $step.freq_2.items
      - $step.freq_3.items
      - $step.freq_4.items
      - $step.freq_5.items
      - $step.freq_6.items
      - $step.freq_7.items
      - $step.freq_8.items
