# Equivalent to (any site via vars.sitename, no .md suffix):
#   python scripts/webscrape_site_facts.py {sitename}.md \
#     --taxonomy website_claims --ai-strength fast --batch-size 20 \
#     "extract facts as a structured JSON file, strictly following the supplied taxonomy, no exceptions. All dimensions of the taxonomy must be included in every record."
#
# Submit for e.g. acme.com export saved as acme.md:
#   POST /workflows/submit
#   {
#     "config": "webscrape_create_facts.yaml",
#     "vars": { "sitename": "acme" },
#     (subprocess_timeout defaults to 7200s per step on the workflow server; raise if needed.)
#     "ai_timeout": 600
#   }
#
# Requires: taxonomy at data/taxonomy/website_claims.yaml; markdown at repo root or data/webscrape/sites/{sitename}.md (see script resolve_input_path).

id: webscrape_create_facts
description: Run webscrape_site_facts for {sitename}.md → JSON under data/webscrape/facts/ (website_claims, fast, batch 20).

vars:
  sitename: nebius

steps:
  - id: create_facts
    type: subprocess
    timeout: 7200
    command:
      - python3
      - scripts/webscrape_site_facts.py
      - "{sitename}.md"
      - --taxonomy
      - website_claims
      - --ai-strength
      - fast
      - --batch-size
      - "20"
      - "extract facts as a structured JSON file, strictly following the supplied taxonomy, no exceptions. All dimensions of the taxonomy must be included in every record."
