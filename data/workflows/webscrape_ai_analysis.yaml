# Fetch stored page content from multiple sites (by sitename + namespace),
# aggregate everything, and send it to an AI prompt provided as input.
#
# Submit:
#   POST /workflows/submit
#   {
#     "config": "webscrape_ai_analysis.yaml",
#     "vars": {
#       "sites": "https://nvidia.com,https://6sense.com",
#       "namespace": "semis",
#       "prompt": "Summarize the key products and services offered by each company."
#     }
#   }
#
# CLI:
#   python3 scripts/workflow_run.py data/workflows/webscrape_ai_analysis.yaml --local \
#     --set 'sites=https://nvidia.com,https://6sense.com' \
#     --set namespace=semis \
#     --set 'prompt=Summarize the key products and services offered by each company.'

id: webscrape_ai_analysis
description: Fetch pages from multiple sites in {namespace}, aggregate content, and send to AI with a custom prompt.

vars:
  sites: ""
  namespace: webscrape
  prompt: "Summarize the content from the sites below."
  profile: agent
  provider: anthropic
  max_content: "3000"

steps:
  - id: fetch_all
    type: subprocess
    command:
      - python3
      - -c
      - |
        import sys, json, os
        from pathlib import Path
        ROOT = Path(__file__ if '__file__' in dir() else '.').resolve().parents[0]
        sys.path.insert(0, str(ROOT))
        import httpx
        from common.skill_lifecycle import find_live_worker

        sites_raw = os.environ.get("SITES", "")
        namespace = os.environ.get("NS", "webscrape")
        max_content = int(os.environ.get("MAX_CONTENT", "3000"))

        registry = os.environ.get("REGISTRY_SERVER_URL", "http://127.0.0.1:7002").rstrip("/")
        worker = find_live_worker(registry)
        if not worker:
            print("ERROR: no live worker", file=sys.stderr)
            sys.exit(1)
        worker = worker.rstrip("/")

        sites = [s.strip() for s in sites_raw.split(",") if s.strip()]
        if not sites:
            print("ERROR: no sites provided", file=sys.stderr)
            sys.exit(1)

        output_parts = []
        for site in sites:
            url = f"{worker}/skills/webscraper_skill/pages/list"
            params = {"sitename": site, "namespace": namespace, "max_content": max_content}
            try:
                r = httpx.get(url, params=params, timeout=120.0)
                r.raise_for_status()
                data = r.json()
                items = data.get("items", [])
                print(f"[fetch] {site}: {len(items)} pages", file=sys.stderr, flush=True)
                output_parts.append(f"=== SITE: {site} ({len(items)} pages) ===\n")
                for item in items:
                    page_url = item.get("url", "")
                    content = item.get("content", "")
                    output_parts.append(f"--- {page_url} ---\n{content}\n")
            except Exception as e:
                print(f"[fetch] {site}: FAILED - {e}", file=sys.stderr, flush=True)
                output_parts.append(f"=== SITE: {site} (FAILED: {e}) ===\n")

        print("\n".join(output_parts))
    env:
      SITES: "{sites}"
      NS: "{namespace}"
      MAX_CONTENT: "{max_content}"

  - id: ai_analysis
    type: ai
    prompt: |
      {prompt}

      Below is the aggregated content from the requested websites.
      Use this content to answer the prompt above.

      $step.fetch_all.stdout
    profile: "{profile}"
    provider: "{provider}"
    depends_on: [fetch_all]
