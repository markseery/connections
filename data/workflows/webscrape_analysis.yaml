# Generic: load stored webscrape content and run an AI prompt (webscrape_analysis.py).
# Requires registry, worker (webscraper_skill), aiserver. Site must already be scraped.
#
# Equivalent CLI:
#   python3 scripts/webscrape_analysis.py \
#     --namespace {namespace} --sitename {sitename} --url {url} \
#     --prompt "{prompt}"
#
# Use url "*" (asterisk) for combined content of all stored pages under sitename.
#
# Submit:
#   POST /workflows/submit
#   {
#     "config": "webscrape_analysis.yaml",
#     "vars": {
#       "sitename": "https://example.com",
#       "url": "*",
#       "prompt": "What are the main themes across this site?"
#     }
#   }

id: webscrape_analysis
description: AI analysis over stored crawl for {sitename} (url={url}).

vars:
  namespace: webscrape
  sitename: https://example.com
  url: "*"
  prompt: "What are the main themes across this site?"

steps:
  - id: analyze
    type: subprocess
    command:
      - python3
      - scripts/webscrape_analysis.py
      - "--namespace"
      - "{namespace}"
      - "--sitename"
      - "{sitename}"
      - "--url"
      - "{url}"
      - "--prompt"
      - "{prompt}"
