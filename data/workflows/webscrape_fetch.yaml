# Generic: crawl a site via webscraper_skill (same as scripts/webscrape_fetch.py).
# Lists stored URLs, runs scrape, waits for job, prints before/after diff.
# Requires registry + worker. Large max-pages crawls need a high subprocess_timeout on submit.
#
# Equivalent CLI:
#   python3 scripts/webscrape_fetch.py {sitename} --namespace {namespace} \\
#     --max-pages {max_pages} --max-depth {max_depth}
#
# Submit:
#   POST /workflows/submit
#   {
#     "config": "webscrape_fetch.yaml",
#     "vars": {
#       "sitename": "https://example.com",
#       "namespace": "webscrape",
#       "max_pages": "4999",
#       "max_depth": "99"
#     },
#     (optional) "subprocess_timeout": 14400
#   }

id: webscrape_fetch
description: Deep fetch {sitename} into namespace {namespace} (max_pages={max_pages}, max_depth={max_depth}).

vars:
  sitename: https://example.com
  namespace: webscrape
  max_pages: 4999
  max_depth: 99

steps:
  - id: fetch
    type: subprocess
    timeout: 7200
    command:
      - python3
      - scripts/webscrape_fetch.py
      - "{sitename}"
      - "--namespace"
      - "{namespace}"
      - "--max-pages"
      - "{max_pages}"
      - "--max-depth"
      - "{max_depth}"
