# Two-step: (1) crawl + store via webscrape_fetch.py, (2) export markdown via webscrape_save.py.
# Same net effect as running workflow_run.py for webscrape_fetch.yaml then webscrape_save_site.yaml
# with matching site_url/sitename and out — inlined here as one workflow.
#
# Requires: registry, worker, storage-backed crawl. Use a large subprocess_timeout for big crawls.
#
# Example (Nebius-style):
#   python3 scripts/workflow_run.py webscrape_fetch_and_save.yaml --local \\
#     --set site_url=https://nebius.com --set out=nebius.md \\
#     --set namespace=webscrape --set max_pages=4999 --set max_depth=99
#
# Or POST /workflows/submit (subprocess_timeout defaults to 7200s/step; increase e.g. 14400 for huge sites)

id: webscrape_fetch_and_save
description: Fetch {site_url} then write data/webscrape/sites/{out}.

vars:
  site_url: https://example.com
  namespace: webscrape
  max_pages: 4999
  max_depth: 99
  out: example.md

steps:
  - id: fetch
    type: subprocess
    timeout: 7200
    command:
      - python3
      - scripts/webscrape_fetch.py
      - "{site_url}"
      - "--namespace"
      - "{namespace}"
      - "--max-pages"
      - "{max_pages}"
      - "--max-depth"
      - "{max_depth}"

  - id: save_markdown
    type: subprocess
    timeout: 7200
    command:
      - python3
      - scripts/webscrape_save.py
      - "--out"
      - "{out}"
      - "{site_url}"
