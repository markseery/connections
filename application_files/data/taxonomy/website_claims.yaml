# website_claims — derived from data/webscrape/facts/nebius.com_facts_20260322_230146.json
# Use with: scripts/webscrape_site_facts.py ... --taxonomy website_claims
#
# The referenced fact export used three categorical dimensions plus a free-text field;
# keys for the text varied (fact / content / claim). For new extractions, prefer one
# consistent key (e.g. "statement") in your prompt or post-process to normalize.

dimensions:
  category:
    values:
      - product
      - service
      - solution
      - support
      - pricing
      - metric
      - compliance
      - customer
      - partnership
      - person
      - other

  type:
    values:
      - name
      - role
      - amount
      - quote

  claim:
    values:
      - value

  url:
    values:
      - page_url

  site:
    values:
      - site_name

  context:
    values:
      - description

