# Supervisor agent configuration
max_subagents: 5
max_steps_per_subagent: 10
max_replan_attempts: 3
approval_policy: approve_irreversible  # auto | approve_all | approve_irreversible
timeout: 3600
context_window_limit: 32000
plan_cache_ttl: 300
execution_timeout: 120.0

memory:
  working_ttl: 3600
  episodic_max_entries: 100
  compaction_threshold: 20000
  semantic_max_entries: 500
  recent_episodes_limit: 5
  semantic_relevance_limit: 10

logging:
  level: info
  file: logs/agent.jsonl
  approvals_file: logs/approvals.jsonl

polling:
  min_delay: 1.0
  max_delay: 30.0
  backoff: 1.5
  burst_polls: 2
  cooldown_after: 20

approval:
  ttl_seconds: 3600
  storage_namespace: agent_approvals

compaction:
  recent_steps_to_keep: 3
  summarise_max_chars: 30000
  ai_profile: fast

subagent:
  shared_context_max_chars: 4000
