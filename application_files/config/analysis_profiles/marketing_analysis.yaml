  - name: Implied marketing strategy
    guidance: >
      Considering assessed positioning, value propositions, ideal customer profile, etc
      What is the implied marketing strategy for the company?
      What is implied about how it will win?
      What competitive moat are they building? 
      What market dynamics are they exploiting?
      What trends are they riding?
      This is interpretive — lookfor patterns across pricing, partnerships, technology choices, and geographic expansion.










