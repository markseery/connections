# Analysis profile: Marketing – Strategic & Interpretive
#
# Used by batch_analysis.py via --profile marketing_strategic
# Extracts softer, interpretive insights that require reading
# between the lines: positioning, brand identity, strategy.
# Uses a lower context_pct to create more, smaller batches so the
# model has better attention bandwidth for inferential topics.

name: Marketing – Strategic & Interpretive
description: >
  Analyse a company's website for strategic positioning, brand
  identity, value propositions, and competitive strategy.  These
  topics require interpreting tone, patterns, and implied intent
  rather than extracting explicit facts.

# ── Storage source ──
namespace: webscrape
key_separator: "\x00"

# ── AI settings ──
# Lower context_pct creates more batches, giving the model better
# focus on each chunk of content for interpretive analysis.
ai_profile: agent
context_pct: 0.50
chars_per_token: 3.5
ai_timeout: 660

topics:

  - name: Positioning statements
    guidance: >
      Extract taglines, hero copy, "we are the X of Y" statements,
      competitive differentiators, and any language that positions the company
      relative to competitors or market categories.

  - name: Overall brand identity
    guidance: >
      Look for brand values, mission statements, vision statements, tone of
      voice patterns, and how the company describes its culture and ethos.

  - name: Value proposition statements
    guidance: >
      Extract explicit value propositions: "we help X do Y by Z", benefit
      statements, ROI claims, and any quantified customer outcomes.

  - name: Ideal customer profile
    guidance: >
      Look for language describing who the company targets: company size,
      industry, use case, technical maturity, geographic focus.  Infer from
      case studies and marketing language if not stated explicitly.

      Match to the customer profile descriptions:

      Persona Profile: Alice, AI Platform Leader

        ## Overview
        * **Role:** AI Platform Leader
        * [cite_start]**Alternative Titles:** VP / Head of Machine Learning Platform, Head of Data & AI/ML Engineering (platform remit), Principal / Staff Platform Engineer (AI/ML), VP of ML Infrastructure, VP of AI Infrastructure, Head of ML Systems / ML Systems Engineering[cite: 1].
        * **Who I Am:** Alice is responsible for the infrastructure supporting models, agents, and AI features. She owns the AI platform end to end, balancing speed with reliability, latency, cost, and compliance. [cite_start]She sets the technical vision, is hands-on with architecture decisions (deployment, scale, monitoring), evaluates new tech vendors, and partners with cross-functional teams (Product, Infra, Data, Security, Finance)[cite: 1]. 
        * [cite_start]**How I Am Evaluated:** Her success is primarily evaluated based on model performance quality and deployment speed/time to market[cite: 1]. [cite_start]Success also means on-time launches, measurable impact, and trustworthy outcomes[cite: 1].

        ---

        ## Responsibilities & Challenges
        * [cite_start]**Primary Responsibilities:** Cross-functional collaboration and foundation/specialized model R&D (especially among AI Natives)[cite: 1].
        * [cite_start]**Biggest Challenges:** Compute and GPU resource scarcity is a common overarching challenge[cite: 1]. [cite_start]Governance and the heavy regulatory burden (e.g., stalled deployments for documentation, auditors pushing for explainability) combined with cost management make AI investments hard to justify[cite: 1]. [cite_start]She also struggles with brittle scaling and being locked into proprietary stacks[cite: 1].

        ---

        ## Motivations & Excitements
        * [cite_start]**What Excites Me:** Rapid innovation and having a technical edge are the most exciting aspects overall[cite: 1]. [cite_start]AI Natives are additionally excited by operational efficiency, cost optimization, and turning frontier AI into a lean, portable platform[cite: 1]. [cite_start]AI Enterprises are driven by building scalable, flexible AI platforms that stay audit-ready and move business outcomes[cite: 1].
        * [cite_start]**What Motivates Me:** Security is top of mind across the board[cite: 1]. [cite_start]AI Natives are highly motivated by cost efficiency, ROI pressures, and boosting developer velocity[cite: 1].

        ---

        ## Buying Behavior & Preferences
        * [cite_start]**Why I Buy:** Infrastructure and capacity limitations are the top overall buying triggers, alongside cost management and budget optimization challenges[cite: 1]. [cite_start]AI Natives also buy for innovation and new features, whereas AI Enterprises buy to meet compliance, security, and governance requirements[cite: 1].
        * [cite_start]**Biggest Concerns:** Security risks are the top concern, followed closely by vendor lock-in and flexibility limits[cite: 1]. [cite_start]She worries about getting trapped in a managed stack where prices shift, GPUs go scarce, and migration turns into massive tech debt[cite: 1].
        * [cite_start]**Must-Have Features:** Security and scalability are the top two features for AI Enterprises, while AI Natives also require rapid experimentation[cite: 1]. 
        * [cite_start]**Needs Beyond Features:** Vendor financial and roadmap stability is the top factor overall[cite: 1]. [cite_start]She needs transparent and predictable pricing, contract flexibility, professional services implementation and support, and cultural alignment as a co-innovation partner[cite: 1].
        * [cite_start]**Top Factors to Switch Vendors:** Both AI Natives and Enterprises would switch for: 1) Performance & Scalability, 2) Guaranteed Capacity & Availability, and 3) Transparent & Predictable Pricing[cite: 1].
        * [cite_start]**Vendors Top of Mind:** AWS, Azure, and GCP are top of mind overall (especially for standardizing security in AI Enterprises)[cite: 1]. [cite_start]AI Natives additionally think of open-source and specialized tooling like OpenAI, Hugging Face, Databricks, and Weights & Biases[cite: 1].
        * [cite_start]**Information Sources:** Internal colleagues (engineers, researchers) are her primary go-to inputs[cite: 1]. [cite_start]She also relies heavily on peer companies for "plain-spoken stories," industry reports for future trends, and executive leadership (especially within AI Enterprises)[cite: 1].
        * [cite_start]**Most Impactful Infrastructure Factors:** Cost efficiency with visibility/showback is the top infrastructure factor[cite: 1]. [cite_start]Other highly impactful factors include guaranteed capacity and scheduler efficiency, security (for Enterprises), and developer experience (self-service and templates)[cite: 1].

      Persona Profile: Carter, CTO/Technical Buyer [cite: 1]

