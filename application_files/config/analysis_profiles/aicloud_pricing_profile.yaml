# Analysis profile: Marketing – Factual & Quantitative
#
# Used by batch_analysis.py via --profile marketing_factual
# Extracts hard facts, numbers, names, and structured data that
# are explicitly stated on the website.  High context_pct works
# well here because the model is pattern-matching concrete data.

name: Pricing information
description: >
  Extract concrete, verifiable facts from a company's website:
  Pricing information.

# ── Storage source ──
namespace: webscrape
key_separator: "\x00"

# ── AI settings ──
ai_profile: agent
context_pct: 0.80
chars_per_token: 3.5
ai_timeout: 660

topics:
  - name: GPU Pricing
    guidance: >
      GPU hour pricing for the company's GPU instances.
      Break down by type of GPU

  - name: Token Pricing
    guidance: >
      Any per token pricing information.

  - name: Product / service pricing
    guidance: >
      Inference pricing
      Training pricing
      Reinforcement learning pricing
      Evaluation pricing
      Support pricing

  - name: Power and cooling pricing
    guidance: >
      Any power or cooling pricing information.

  - name: Other pricing
    guidance: >
      Any other pricing information.
  