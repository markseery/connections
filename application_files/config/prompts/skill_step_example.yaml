# Example: mix AI and skill steps. Skill is loaded on the worker before use.
#
# rss_skill returns: { "feed": { title, link, ... }, "items": [ { title, link, published, ... }, ... ] }.
# Omit output_path to pass the full JSON to the next step (like rss_notify_new.py does).
# Use output_path (e.g. "items") only if you want a single field as step output.

steps:
  - id: fetch
    type: skill
    skill: rss_skill
    endpoint: feed
    params:
      url: "https://news.ycombinator.com/rss"
    # no output_path = full response (feed + all items) as step output for {previous_output}

  - id: summarize
    type: ai
    prompt: |
      Below is a fetched RSS feed, retrieve a summarize the content :

      {previous_output}

    profile: agent
