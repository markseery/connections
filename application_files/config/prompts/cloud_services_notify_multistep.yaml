# Multi-step: rss_new_and_save_skill -> summarize -> format as HTML -> send email.
# Steps 2–4 run only when there are new items (skip_if_previous_empty skips when fetch output is []).
# Optional vars: list_name, email_to (use user@example.com for default_receiver).

vars:
  list_name: cloud-news
  email_to: mseery@coreweave.com

steps:
  - id: fetch_new
    type: skill
    skill: rss_new_and_save_skill
    endpoint: run
    timeout: 7200
    params:
      list_name: "{list_name}"
      dry_run: false
      debug: true
    poll:
      route: /skills/rss_new_and_save_skill/jobs/$step.fetch_new.job_id
      field: status
      target: completed
      interval: 5
      max_attempts: 1440
    output_path: result.data.new_items

  - id: summarize
    type: ai
    run_when: { step: fetch_new, path: result.data.new_items_count, min: 1 }
    prompt: |
      The below is a JSON list of new RSS items. Retrieve the content of each from the content field and succinctly summarize the entire content of all items together, without duplication, focusing on cloud services providers such as, but not limited to, CoreWeave, Iren, Nebius, NSCALE, AWS, Azure, Google, Microsoft, and others.
      At the end, include a CONTENT SOURCE SUMMARY section where each source is a markdown hyperlink using the item's link field, formatted as: [Title](URL) (Source Name). Every source MUST be a clickable hyperlink — never output a bare title without its URL.
      {previous_output}
    profile: agent

  - id: format_email
    type: ai
    run_when: { step: fetch_new, path: result.data.new_items_count, min: 1 }
    prompt: |
      Format the following content as a modern, minimalistic HTML email. Return HTML ONLY with no strings or spaces before or after the HTML. All markdown links [text](url) MUST be converted to <a href="url">text</a> tags — every source reference must be a clickable hyperlink:
      {previous_output}
    profile: agent

  - id: send_notification
    type: skill
    skip_if_previous_empty: true
    run_when: { step: fetch_new, path: result.data.new_items_count, min: 1 }
    skill: notification_skill
    endpoint: send
    params:
      to: ["{email_to}"]
      subject: "{list_name} - new items"
      body: " "
      html_body: "{previous_output}"
