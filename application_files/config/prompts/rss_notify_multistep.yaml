# Multi-step: rss_new_and_save_skill -> summarize -> format as HTML -> send email.
# Steps 2–4 run only when there are new items (skip_if_previous_empty skips when fetch output is []).
# Optional vars: list_name, email_to (use user@example.com for default_receiver).

vars:
  list_name: general-news
  email_to: mseery@coreweave.com

steps:
  - id: fetch_new
    type: skill
    skill: rss_new_and_save_skill
    endpoint: run
    timeout: 7200
    params:
      list_name: "{list_name}"
      dry_run: false
      debug: true
    poll:
      route: /skills/rss_new_and_save_skill/jobs/$step.fetch_new.job_id
      field: status
      target: completed
      interval: 5
      max_attempts: 1440
    output_path: result.data.new_items

  - id: summarize
    type: ai
    skip_if_previous_empty: true
    prompt: |
      The below is a JSON is a list of new RSS items, retrieve the content of each from the content field, succinctly and tersely summarize the entire content of all items together, without duplication, include the RSS item titles and links as a content source summary at the end:
      {previous_output}
    profile: agent

  - id: format_email
    type: ai
    skip_if_previous_empty: true
    prompt: |
      Format the following content in a modern but minimalistic HTML email, returning HTML ONLY with no strings or spaces before or after the HTML:
      {previous_output}
    profile: agent

  - id: send_notification
    type: skill
    skip_if_previous_empty: true
    run_when: { step: fetch_new, path: result.data.new_items_count, min: 1 }
    skill: notification_skill
    endpoint: send
    params:
      to: ["{email_to}"]
      subject: "{list_name} - new items"
      body: " "
      html_body: "{previous_output}"
