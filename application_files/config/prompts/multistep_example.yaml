# Multi-step example: each step can use files and placeholders.
# Placeholders: {previous_output}, {step_1_output}, {step_2_output}, {<id>_output}

steps:
  - id: extract
    prompt: |
      From the context below, list every company and product mentioned.
      Output a simple bullet list.
    profile: agent
    files:
      - README.md

  - id: summarize
    prompt: |
      The previous step produced this list:

      {previous_output}

      Summarize it into 3–5 categories with one line each.
    profile: agent
    # no files; input comes from placeholder

  - id: priorities
    prompt: |
      Categories from previous step:

      {summarize_output}

      Suggest 2 strategic priorities based on these categories.
    profile: agent
