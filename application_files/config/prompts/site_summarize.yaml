# Two steps: (1) retrieve stored website content (truncated to fit AI context), (2) AI summarize.
# The site must already be scraped and stored. max_chars keeps the prompt under provider limits (e.g. 100000).
# Optional vars: base_url, max_chars.

vars:
  base_url: "https://coreweave.com"
  max_chars: 180000

steps:
  - id: retrieve_site
    type: skill
    skill: stored_webscrape_skill
    endpoint: stored
    params:
      base_url: "{base_url}"
      max_chars: "{max_chars}"
    output_path: combined_text

  - id: summarize
    type: ai
    prompt: |
      From the following context, list all pages and their URLs, that mention there are 33 data centers or any number of data centers other than 43:

      {previous_output}
    profile: agent
