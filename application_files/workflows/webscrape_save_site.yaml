# Generic: export already-stored webscrape pages to markdown (same as webscrape_save.py).
# The site must have been scraped and stored first (e.g. via webscraper_skill). Requires
# registry + worker reachable from the workflow host.
#
# Equivalent CLI (example):
#   python3 scripts/webscrape_save.py --out {out} {site_url}
#
# Submit:
#   POST /workflows/submit
#   {
#     "config": "webscrape_save_site.yaml",
#     "vars": {
#       "site_url": "https://example.com",
#       "out": "example.md"
#     }
#   }
#
# Or: python3 scripts/workflow_run.py webscrape_save_site.yaml --local \\
#       --set site_url=https://example.com --set out=example.md

id: webscrape_save_site
description: Write stored crawl for {site_url} to data/webscrape/sites/{out} via webscrape_save.py.

vars:
  site_url: https://example.com
  out: example.md

steps:
  - id: save_markdown
    type: subprocess
    command:
      - python3
      - scripts/webscrape_save.py
      - "--out"
      - "{out}"
      - "{site_url}"
