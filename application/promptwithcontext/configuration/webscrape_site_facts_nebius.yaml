# Workflow: structured facts from saved webscrape markdown (Nebius example).
#
# Closest to:
#   python scripts/webscrape_site_facts.py nebius.md \
#     --taxonomy website_claims --ai-strength fast --batch-size 20 \
#     "extract facts as a structured JSON file, strictly following the supplied taxonomy..."
#
# Differences: this runner uses one AI call with full file context (workflow server does not
# run the Python batching/dedupe/save path). For identical behavior, run the command above.
# Input markdown path matches resolve_input_path: nebius.md at repo root or under data/webscrape/sites/.
#
# Run via workflow server:
#   POST /workflows/submit
#   {"config": "webscrape_site_facts_nebius.yaml", "ai_timeout": 600, "skill_timeout": 300}
#
# Or CLI (from repo root):
#   python -c "from pathlib import Path; from servers.workflow.executor import WorkflowExecutor; \
#     WorkflowExecutor().run(Path('application/promptwithcontext/configuration/webscrape_site_facts_nebius.yaml'))"

id: webscrape_site_facts_nebius
description: Extract taxonomy-constrained JSON facts from nebius.md using website_claims taxonomy (fast profile).

steps:
  - id: extract_facts
    type: ai
    profile: fast
    files:
      - nebius.md
      - data/taxonomy/website_claims.yaml
    prompt: |
      extract facts as a structured JSON file, strictly following the supplied taxonomy, no exceptions.
      All dimensions of the taxonomy must be included in every record.

      The first file in context is the scraped site markdown (pages separated by --- and ## URL headings).
      The second file is the taxonomy YAML: use only the dimension names and allowed values listed there.

      Output a JSON array of fact objects. Each object must include every taxonomy dimension as a field,
      plus a "statement" string and "source_url" (or "page_url") when you can tie the fact to a URL from the markdown.
