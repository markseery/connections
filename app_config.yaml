app_name: connections
# Optional overrides for common/timeouts.py defaults (see common/timeouts.py _DEFAULTS).
timeouts:
  workflow_subprocess: 7200
health:
  interval_seconds: 60
  timeout_seconds: 1
  retries: 3
  fail_retry_delay_seconds: 2
servers:
  - name: registry
    app: servers.registry.main:app
    host: 127.0.0.1
    port: 7002
  - name: storage
    app: servers.storage.main:app
    host: 127.0.0.1
    port: 7010
  - name: configuration
    app: servers.configuration.main:app
    host: 127.0.0.1
    port: 7011
  - name: aiserver
    app: servers.aiserver.main:app
    host: 127.0.0.1
    port: 7012
  - name: chat
    app: servers.chat.main:app
    host: 127.0.0.1
    port: 7023
  - name: connections_ui
    app: servers.connections_ui.main:app
    host: 127.0.0.1
    port: 7020
  - name: agent
    app: servers.agent.main:app
    host: 127.0.0.1
    port: 7024
  - name: autonomous
    app: servers.autonomous.main:app
    host: 127.0.0.1
    port: 7027
  - name: workflow
    app: servers.workflow.main:app
    host: 127.0.0.1
    port: 7026
  - name: state
    app: servers.state.main:app
    host: 127.0.0.1
    port: 7028
  - name: worker
    app: servers.worker.main:app
    host: 127.0.0.1
    port: 7030
    instances: 6
